<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 50px; background-color: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 600px;" appSinglish>
    <h1 style="color: #1c1e21; margin-top: 0; font-size: 28px;">Singlish Pro + Angular</h1>
    <p style="color: #606770; margin-bottom: 25px; font-size: 16px;">
      This Angular application uses a standalone <strong>Directive</strong> to enable Sinhala transliteration.
    </p>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-weight: 600; color: #4b4f56; margin-bottom: 10px;">Type here (Ctrl + Shift + S):</label>
      <textarea 
        placeholder="oyata kohomada? amma ko?"
        style="width: 100%; height: 200px; padding: 20px; border: 2px solid #dddfe2; border-radius: 10px; font-size: 18px; outline: none; transition: border-color 0.2s;"
        onfocus="this.style.borderColor='#1877f2'"
        onblur="this.style.borderColor='#dddfe2'"
      ></textarea>
    </div>

    <div style="font-size: 12px; color: #90949c; border-top: 1px solid #dddfe2; padding-top: 15px;">
      Powered by Singlish Pro NPM package
    </div>
  </div>
</div>
